<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spud Shockers 3D - Direct Play</title>
    <style>
        body, html {
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
            background-color: #111;
            font-family: sans-serif;
            user-select: none;
        }
        #container3d { width: 100%; height: 100%; display: block; }
        #hud {
            position: absolute; bottom: 20px; left: 20px;
            color: white; font-size: 24px; font-weight: bold;
            z-index: 5; text-shadow: 2px 2px #000;
            background: rgba(0,0,0,0.6); padding: 12px; border-radius: 8px;
            border: 2px solid #ffcc00; pointer-events: none;
        }
        #score-board {
            position: absolute; top: 20px; right: 20px;
            color: #ffcc00; font-size: 22px; font-weight: bold;
            background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px;
            pointer-events: none;
        }
        #weapon-sprite {
            position: absolute; bottom: 0; right: 20%;
            width: 260px; height: auto; z-index: 6; pointer-events: none;
        }
        #top-bar {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff;
            padding: 8px 20px; border-radius: 20px; font-size: 14px;
            border: 1px solid #555; z-index: 10; text-align: center;
            pointer-events: none;
            width: max-content;
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="top-bar">🖱️ <b>HOLD & DRAG MOUSE</b> to look around 360° | ⌨️ <b>W,A,S,D</b> to walk | 💥 <b>SPACEBAR</b> to shoot!</div>
    <div id="hud">🥔 HP: <span id="hp-val">100</span> | 🎯 AMMO: <span id="ammo-val">30</span></div>
    <div id="score-board">SPUD KILLS: <span id="kills-val">0</span></div>
    <img id="weapon-sprite" src="https://ibb.co">
    <div id="container3d"></div>

    <script>
        let scene, camera, renderer, clock;
        let moveF = false, moveB = false, moveL = false, moveR = false;
        let vel = new THREE.Vector3(), dir = new THREE.Vector3();
        let enemies = [];
        let playerHp = 100, kills = 0, ammo = 30;
        
        let yaw = 0, pitch = 0, isDragging = false;
        let prevMouseX = 0, prevMouseY = 0;

        function init() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa0c4ff);
            scene.fog = new THREE.FogExp2(0xa0c4ff, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container3d').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            let sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Floor Plane Matrix
            let floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshToonMaterial({ color: 0x7a9a60 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Add obstacles to hide behind
            for(let i=0; i<15; i++) {
                let box = new THREE.Mesh(new THREE.BoxGeometry(4, 8, 4), new THREE.MeshToonMaterial({color: 0xdeb887}));
                box.position.set(Math.random()*60-30, 4, Math.random()*60-30);
                scene.add(box);
            }

            // Keyboard Bindings
            window.addEventListener('keydown', (e) => handleKeys(e.code, true));
            window.addEventListener('keyup', (e) => handleKeys(e.code, false));
            
            // Drag Control Mechanics
            window.addEventListener('mousedown', (e) => {
                isDragging = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleDragLook);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            for(let i=0; i<4; i++) spawnEnemy();
            animate();
        }

        function handleKeys(code, isDown) {
            if (code === 'KeyW') moveF = isDown;
            if (code === 'KeyS') moveB = isDown;
            if (code === 'KeyA') moveL = isDown;
            if (code === 'KeyD') moveR = isDown;
            if (code === 'Space' && isDown) fireWeapon();
        }

        function handleDragLook(e) {
            if (!isDragging) return;
            let deltaX = e.clientX - prevMouseX;
            let deltaY = e.clientY - prevMouseY;
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;

            yaw -= deltaX * 0.005;
            pitch -= deltaY * 0.005;
            pitch = Math.max(-1.4, Math.min(1.4, pitch));

            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        }

        function spawnEnemy() {
            let group = new THREE.Group();
            let spud = new THREE.Mesh(new THREE.SphereGeometry(1.3, 16, 16), new THREE.MeshToonMaterial({ color: 0xcd853f }));
            spud.scale.set(1, 1.4, 1);
            group.add(spud);

            let eye = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({color: 0xff0000}));
            eye.position.set(0, 0.6, 1.1);
            group.add(eye);

            group.position.set(Math.random()*60-30, 1.8, Math.random()*60-30);
            scene.add(group);
            enemies.push({ mesh: group, hp: 30 });
        }

        function fireWeapon() {
            if (ammo <= 0) return;
            ammo--;
            document.getElementById('ammo-val').innerText = ammo;

            let gun = document.getElementById('weapon-sprite');
            gun.style.transform = 'scale(1.2) translateY(10px)';
            setTimeout(() => gun.style.transform = 'scale(1)', 60);

            let camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);

            enemies.forEach((enemy, i) => {
                let vec = enemy.mesh.position.clone().sub(camera.position);
                let dist = vec.length();
                let projected = camera.position.clone().add(camDir.multiplyScalar(dist));

                if (projected.distanceTo(enemy.mesh.position) < 2.5) {
                    enemy.hp -= 10;
                    enemy.mesh.children[0].material.color.setHex(0xffffff);
                    setTimeout(() => enemy.mesh.children[0].material.color.setHex(0xcd853f), 80);

                    if (enemy.hp <= 0) {
                        scene.remove(enemy.mesh);
                        enemies.splice(i, 1);
                        kills++;
                        document.getElementById('kills-val').innerText = kills;
                        setTimeout(spawnEnemy, 1000);
                    }
                }
            });

            if (ammo === 0) {
                setTimeout(() => { ammo = 30; document.getElementById('ammo-val').innerText = ammo; }, 1200);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            let delta = Math.min(clock.getDelta(), 0.1);

            vel.x -= vel.x * 8 * delta;
            vel.z -= vel.z * 8 * delta;

            dir.z = Number(moveF) - Number(moveB);
            dir.x = Number(moveR) - Number(moveL);
            dir.normalize();

            let rot = new THREE.Euler(0, yaw, 0, 'YXZ');
            dir.applyEuler(rot);
            vel.z -= dir.z * 45 * delta;
            vel.x -= dir.x * 45 * delta;
            camera.position.addScaledVector(vel, delta);

            camera.position.x = Math.max(-55, Math.min(55, camera.position.x));
            camera.position.z = Math.max(-55, Math.min(55, camera.position.z));

            enemies.forEach(e => {
                e.mesh.lookAt(camera.position.x, e.mesh.position.y, camera.position.z);
                let p = new THREE.Vector3().subVectors(camera.position, e.mesh.position).normalize();
                e.mesh.position.addScaledVector(p, 3.5 * delta);

                if (e.mesh.position.distanceTo(camera.position) < 3) {
                    playerHp = Math.max(0, playerHp - 10 * delta);
                    document.getElementById('hp-val').innerText = Math.floor(playerHp);
                    if (playerHp <= 0) {
                        alert('MASHED! Game Over.');
                        location.reload();
                    }
                }
            });

            renderer.render(scene, camera);


        init();
    </script>
</body>
</html>
